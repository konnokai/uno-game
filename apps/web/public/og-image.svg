<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">UNO - real-time card table</title>
  <desc id="description">Play UNO together in a browser.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07130f" />
      <stop offset="1" stop-color="#182c22" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)" />
  <circle cx="1040" cy="80" r="230" fill="#dc2626" opacity="0.16" />
  <circle cx="110" cy="580" r="260" fill="#facc15" opacity="0.12" />
  <g filter="url(#shadow)" transform="translate(720 92) rotate(12 150 210)">
    <rect width="300" height="420" rx="28" fill="#f8fafc" />
    <rect x="18" y="18" width="264" height="384" rx="20" fill="#dc2626" />
    <ellipse cx="150" cy="210" rx="86" ry="150" fill="#f8fafc" transform="rotate(-28 150 210)" />
    <text x="150" y="240" fill="#dc2626" font-family="Arial, sans-serif" font-size="84" font-style="italic" font-weight="900" text-anchor="middle">UNO</text>
  </g>
  <g filter="url(#shadow)" transform="translate(850 150) rotate(28 150 210)">
    <rect width="300" height="420" rx="28" fill="#f8fafc" />
    <rect x="18" y="18" width="264" height="384" rx="20" fill="#facc15" />
    <ellipse cx="150" cy="210" rx="86" ry="150" fill="#f8fafc" transform="rotate(-28 150 210)" />
    <text x="150" y="240" fill="#16a34a" font-family="Arial, sans-serif" font-size="84" font-style="italic" font-weight="900" text-anchor="middle">UNO</text>
  </g>
  <text x="82" y="235" fill="#facc15" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="8">REAL-TIME CARD TABLE</text>
  <text x="72" y="390" fill="#f8fafc" font-family="Arial, sans-serif" font-size="190" font-style="italic" font-weight="900" letter-spacing="-12">UNO</text>
  <text x="90" y="468" fill="#bdc9c4" font-family="Arial, sans-serif" font-size="32" letter-spacing="2">PLAY TOGETHER IN YOUR BROWSER</text>
</svg>
